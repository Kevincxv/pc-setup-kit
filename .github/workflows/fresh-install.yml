# Fresh-install test: runs the real setup.ps1 on a clean Windows machine for every release (and on demand), both ways -
# without AI (the default: everything by script, including the optimization) and with the optional Claude part - then
# checks the result and runs the new install's own self-test. GitHub's machines are Windows Server, not Windows 11
# Home/Pro, so it proves the setup flow end to end rather than every Windows 11 detail.
name: fresh install
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  setup:
    name: setup (${{ matrix.claude && 'with Claude' || 'no AI' }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        claude: [false, true]
    env:
      FRESH_WITH_CLAUDE: ${{ matrix.claude && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Test this version, not the published one (the kit updater stays off here; it has its own tests)
        shell: powershell
        run: Remove-Item .\PCSetupKit\kit-source.txt
      - name: Run setup.ps1 (for real, opening nothing at the end)
        shell: powershell
        run: |
          if ($env:FRESH_WITH_CLAUDE -eq '1') { & .\PCSetupKit\setup.ps1 -NoLaunch -WithClaude } else { & .\PCSetupKit\setup.ps1 -NoLaunch }
          exit 0
      - name: Check the installed PC
        shell: powershell
        run: |
          & .\PCSetupKit\tests\fresh\check-install.ps1
          exit $LASTEXITCODE
      - name: The new install's own self-test (the kit's unit tests against the installed scripts)
        shell: powershell
        run: |
          $o = & "$env:USERPROFILE\.claude\self-test.ps1" -Force
          $o
          Get-Content "$env:USERPROFILE\.claude\self-test.log" -ErrorAction SilentlyContinue | Select-String '^\s+FAIL|tests \(unit\)'
          if ("$o" -notmatch '^Self-test \(requested\): \d+ passed, 0 failed') { exit 1 }
      - name: Setup log
        if: always()
        shell: powershell
        run: Get-Content C:\PCSetupKit\setup.log -ErrorAction SilentlyContinue
      - name: Keep the logs (downloadable from the run page)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-logs-${{ matrix.claude && 'claude' || 'noai' }}
          path: |
            C:\PCSetupKit\setup.log
            C:\Users\runneradmin\.claude\self-test.log
            C:\Users\runneradmin\.claude\self-test.json
            C:\Users\runneradmin\.claude\maint-report.txt
            C:\Users\runneradmin\Documents\PC Setup Kit report.txt
          if-no-files-found: ignore

  # Releases are published as pre-releases (publish-kit.ps1); installed PCs and the installer only take the "latest"
  # release. It becomes the latest only here: both fresh installs passed, and the unit tests of the same commit too.
  promote:
    name: release to everyone
    needs: setup
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Wait for the unit tests of this commit, then make the release the latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          c=""
          for i in $(seq 1 60); do
            c=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tests.yml --commit "$SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$c" in "completed success") break;; completed*) echo "unit tests: $c - not released"; exit 1;; esac
            sleep 30
          done
          [ "$c" = "completed success" ] || { echo "unit tests did not finish ($c) - not released"; exit 1; }
          newest=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          if [ "$newest" = "$TAG" ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest
            echo "$TAG is now the latest release: installed PCs get it at their next login or daily run"
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest=false
            echo "$TAG passed, but $newest is newer - $TAG is released without becoming the latest"
          fi
