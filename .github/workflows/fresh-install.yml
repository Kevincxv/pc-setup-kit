# Fresh-install test: runs the real setup.ps1 on a clean Windows machine for every release (and on demand), both ways -
# without AI (the default: everything by script, including the optimization) and with the optional Claude part - then
# checks the result and runs the new install's own self-test. GitHub's machines are Windows Server, not Windows 11
# Home/Pro, so it proves the setup flow end to end rather than every Windows 11 detail.
# Daily (schedule): the same for the release everyone gets (the latest) - a change outside the kit (winget, Microsoft's
# downloads, the Claude Code installer, a Windows image update) that breaks a new install shows the next morning, as an
# issue on the repository (GitHub also emails the owner).
name: fresh install
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'   # every day, 07:23 UTC
jobs:
  setup:
    name: setup (${{ matrix.claude && 'with Claude' || 'no AI' }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        claude: [false, true]
    env:
      FRESH_WITH_CLAUDE: ${{ matrix.claude && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Daily check - the latest release, not the newest commit
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          git fetch --depth 1 origin tag "$tag" && git checkout -q "$tag"
          echo "testing the latest release: $tag"
      - name: Test this version, not the published one (the kit updater stays off here; it has its own tests)
        shell: powershell
        run: Remove-Item .\PCSetupKit\kit-source.txt
      - name: Run setup.ps1 (for real, opening nothing at the end)
        shell: powershell
        run: |
          if ($env:FRESH_WITH_CLAUDE -eq '1') { & .\PCSetupKit\setup.ps1 -NoLaunch -WithClaude } else { & .\PCSetupKit\setup.ps1 -NoLaunch }
          exit 0
      - name: Check the installed PC
        shell: powershell
        run: |
          & .\PCSetupKit\tests\fresh\check-install.ps1
          exit $LASTEXITCODE
      - name: The new install's own self-test (the kit's unit tests against the installed scripts)
        shell: powershell
        run: |
          $o = & "$env:USERPROFILE\.claude\self-test.ps1" -Force
          $o
          Get-Content "$env:USERPROFILE\.claude\self-test.log" -ErrorAction SilentlyContinue | Select-String '^\s+FAIL|tests \(unit\)'
          if ("$o" -notmatch '^Self-test \(requested\): \d+ passed, 0 failed') { exit 1 }
      - name: Setup log
        if: always()
        shell: powershell
        run: Get-Content C:\PCSetupKit\setup.log -ErrorAction SilentlyContinue
      - name: Keep the logs (downloadable from the run page)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-logs-${{ matrix.claude && 'claude' || 'noai' }}
          path: |
            C:\PCSetupKit\setup.log
            C:\Users\runneradmin\.claude\self-test.log
            C:\Users\runneradmin\.claude\self-test.json
            C:\Users\runneradmin\.claude\maint-report.txt
            C:\Users\runneradmin\Documents\PC Setup Kit report.txt
          if-no-files-found: ignore

  # Releases are published as pre-releases (publish-kit.ps1); installed PCs and the installer only take the "latest"
  # release. It becomes the latest only here: both fresh installs passed, and the unit tests of the same commit too.
  promote:
    name: release to everyone
    needs: setup
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Wait for the unit tests of this commit, then make the release the latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          c=""
          for i in $(seq 1 60); do
            c=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tests.yml --commit "$SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$c" in "completed success") break;; completed*) echo "unit tests: $c - not released"; exit 1;; esac
            sleep 30
          done
          [ "$c" = "completed success" ] || { echo "unit tests did not finish ($c) - not released"; exit 1; }
          newest=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          if [ "$newest" = "$TAG" ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest
            echo "$TAG is now the latest release: installed PCs get it at their next login or daily run"
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest=false
            echo "$TAG passed, but $newest is newer - $TAG is released without becoming the latest"
          fi
      - uses: actions/checkout@v4
      - name: The install page to the signed installer (once the latest release has it)
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list -R "$GITHUB_REPOSITORY" --limit 5 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
          if ! gh release view "$latest" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'Install-Messiah.exe'; then echo "the latest release ($latest) has no signed installer yet - page unchanged"; exit 0; fi
          git fetch -q origin main && git checkout -q -B main origin/main
          r=$(pwsh -NoProfile -File tools/signing/switch-page.ps1 -Docs docs)
          if [ "$r" = "changed" ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -am "Install page: the signed installer (Install-Messiah.exe)" && git push -q origin main
            echo "install page switched to the signed installer"
          else echo "install page already on the signed installer"; fi

  # The daily check failed: an issue on the repository (one at a time - a later failure adds a comment)
  alert:
    name: report the daily check
    needs: setup
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "Daily install check failed in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Failed again on $(date -u +%F) ($tag): $RUN"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "Daily install check failed ($tag)" --body "A fresh install of the latest release ($tag) failed today: $RUN - something outside the kit may have changed (winget, a download, the Claude Code installer). New installs may be affected until it's fixed."; fi
  # A passing daily check after a failed one: the issue is closed again (the fix worked, or the outside cause went away)
  resolved:
    name: close a fixed daily-check issue
    needs: setup
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "Daily install check failed in:title" --json number --jq '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "The daily fresh install of $tag passed again: $RUN"
          done
