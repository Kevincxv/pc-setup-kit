# Runs the PC Setup Kit unit tests on a clean Windows machine for every push and pull request.
# (The live tests need a real PC with the tray and Claude signed in; they run on the owner's PC before each release.)
name: tests
on:
  push:
    branches: ['**']   # branch pushes only: a release pushes a tag with the same commit (it ran twice)
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install AutoHotkey v2 (to validate the tray script)
        shell: powershell
        continue-on-error: true
        run: choco install autohotkey -y --no-progress
      - name: Build the app from its source (app\Messiah.App - the release ships the copy built with it)
        shell: powershell
        run: |
          & .\tools\app\build.ps1 -Out "$env:RUNNER_TEMP\app"
          $env:PCKIT_IN_TESTS = '1'; $env:PCKIT_CLAUDE_DIR = "$env:RUNNER_TEMP\empty"; New-Item $env:PCKIT_CLAUDE_DIR -ItemType Directory -Force | Out-Null
          $o = & "$env:RUNNER_TEMP\app\MessiahApp.exe" --test | Out-String
          if ($LASTEXITCODE -or $o -match 'PAGE ERROR' -or $o -notmatch 'PAGE: Settings/Tools') { $o; throw 'The freshly built app failed its own test' }
          'The app builds from its source and passes its own test'
      - name: Unit tests (Windows PowerShell 5.1, like the real PCs)
        shell: powershell
        run: |
          & .\PCSetupKit\tests\run-tests.ps1 -Suite unit -Src "$PWD\PCSetupKit\claude" -Kit "$PWD\PCSetupKit"
          exit $LASTEXITCODE
      - name: Summary
        if: always()
        shell: powershell
        run: Get-Content .\PCSetupKit\tests\last-run.txt -ErrorAction SilentlyContinue
